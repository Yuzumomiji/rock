<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロック | Unlock Guild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #12151C;
    --panel: #1B2029;
    --panel-edge: #2C333F;
    --ink: #E9E6DD;
    --ink-soft: #9BA2AC;
    --glow: #8B93D9;
    --glow-dim: #565E9E;
    --gold: #C9A227;
    --gold-dark: #9A7C1E;
    --bubble-chief: #1E2530;
    --bubble-user: #262D3A;
    --panel-a: rgba(27,32,41,0.78);
    --bg-deep-a: rgba(18,21,28,0.70);
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  html {
    overflow-y: scroll;
    overflow-x: hidden;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    max-width: 100%;
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--ink);
  }

  /* ---------- Page stage: 3-column layout ---------- */
  .stage {
    position: relative;
    min-height: 100vh;
    background-color: var(--bg-deep);
    background-image:
      linear-gradient(rgba(12,14,19,0.72), rgba(12,14,19,0.82)),
      url("images/scene-bg.jpg");
    background-repeat: no-repeat, no-repeat;
    background-position: center, center;
    background-size: cover, cover;
    background-attachment: fixed, fixed;
  }

  @media (max-width: 900px) {
    .stage {
      background-position: center, right center;
      background-attachment: scroll, scroll;
    }
  }

  /* 左右は固定背景(スクロールしても動かない)。ページ自体はブラウザ標準のスクロールで流れます。 */
  .side-panel {
    position: fixed;
    top: 0;
    bottom: 0;
    width: calc(50% - 240px);
    overflow: hidden;
    z-index: 0;
    /* 神谷・神崎の世界観イラストが出来たら、この要素に
       background-image (または中に<img>) で差し込んでください。
       今は鍵モチーフのテクスチャ+ヴィネットだけの状態です。 */
  }
  .side-panel.left { left: 0; }
  .side-panel.right { right: 0; }

  .side-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(20,23,31,0) 0%, rgba(18,21,28,0.55) 70%, rgba(18,21,28,0.92) 100%);
  }
  .side-panel.left::after,
  .side-panel.right::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 120px;
    background: linear-gradient(90deg, rgba(18,21,28,0) 0%, rgba(18,21,28,0.9) 100%);
  }
  .side-panel.left::after { right: 0; }
  .side-panel.right::after { left: 0; transform: scaleX(-1); }

  @media (max-width: 900px) {
    .side-panel { display: none; }
  }

  /* ---------- Center column: ふつうのページと同じく、ここはbody/htmlがスクロールします ---------- */
  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: transparent;
  }


  /* ---------- Header ---------- */
  .plaque {
    position: sticky;
    top: 0;
    z-index: 3;
    
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--panel-edge);
    flex-shrink: 0;
  }

  .cat-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 4px;
  }

  .rock-illustration {
    display: block;
    max-width: 100%;
    height: auto;
    max-height: 190px;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.55));
  }

  @media (max-width: 900px) {
    .rock-illustration {
      max-height: 100px;
    }
    .plaque {
      padding: 20px 16px 20px;
    }
  }

  .status {
    text-align: center;
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 5px var(--glow);
    animation: breathe 2.4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.5; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  /* ---------- Chat area (this is the part that scrolls) ---------- */
  .chat-scroll {
    flex: 1;
    min-height: 320px;
    padding: 16px 14px;
    padding-bottom: 84px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .row {
    display: flex;
    gap: 8px;
    max-width: 92%;
  }
  .row.chief { align-self: flex-start; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--panel);
    border: 1.5px solid var(--panel-edge);
    overflow: hidden;
    margin-top: 2px;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }

  .bubble {
    padding: 9px 13px;
    border-radius: 3px;
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .row.chief .bubble {
    background: var(--bubble-chief);
    border-left: 3px solid var(--glow-dim);
    border-radius: 2px 10px 10px 10px;
    color: var(--ink);
  }

  .row.user .bubble {
    background: var(--bubble-user);
    border-right: 3px solid var(--gold-dark);
    border-radius: 10px 2px 10px 10px;
    color: var(--ink);
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .error-note {
    align-self: center;
    font-size: 12.5px;
    color: #D98B7C;
    background: #2A1E1C;
    border: 1px dashed #7A4A40;
    padding: 6px 10px;
    border-radius: 4px;
  }

  /* ---------- Composer ---------- */
  .composer {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    z-index: 3;
    display: flex;
    gap: 8px;
    padding: 10px 30px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--panel-a);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-top: 1px solid var(--panel-edge);
    flex-shrink: 0;
  }

  .composer input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--panel-edge);
    background: var(--bubble-chief);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
  }
  .composer input:focus {
    outline: 2px solid var(--glow);
    outline-offset: 1px;
  }
  .composer input::placeholder { color: var(--ink-soft); }

  .composer button {
    flex-shrink: 0;
    border: 2px solid var(--gold);
    color: var(--gold);
    background: transparent;
    border-radius: 8px;
    padding: 0 16px;
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease;
  }
  .composer button:hover:not(:disabled) {
    background: var(--gold);
    color: var(--bg-deep);
  }
  .composer button:active:not(:disabled) {
    transform: scale(0.94);
  }
  .composer button:focus-visible {
    outline: 2px solid var(--glow);
    outline-offset: 2px;
  }
  .composer button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .chat-scroll::-webkit-scrollbar { width: 8px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--panel-edge); border-radius: 4px; }
</style>
</head>
<body>

<div class="stage">

  <div class="side-panel left" aria-hidden="true"></div>

  <div class="app" id="app">

    <div class="plaque">
      <div class="cat-wrap">
        <img class="rock-illustration" src="images/rock-illustration.png" alt="ロックのイラスト">
      </div>

      <div class="status"><span class="dot"></span>在席中・チャット対応可能</div>
    </div>

    <div class="chat-scroll" id="chat"></div>

    <form class="composer" id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="ロックに相談する…" maxlength="600" />
      <button type="submit" id="sendBtn">送信</button>
    </form>

  </div>

  <div class="side-panel right" aria-hidden="true"></div>

</div>

<script>
  // システムプロンプト(人格設定)はサーバー側の api/chat.js にあります。
  // ここにはAPIキーや人格プロンプトを書かないでください。

  const chat = document.getElementById('chat');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  let history = [];

  const avatarImgHtml = `<img src="images/rock-avatar.png" alt="ロック">`;

  function scrollToBottom() {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'auto' });
  }

  function addMessage(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'chief');

    if (role !== 'user') {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.innerHTML = avatarImgHtml;
      row.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);

    chat.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row chief';
    row.id = 'typingRow';
    const av = document.createElement('div');
    av.className = 'avatar';
    av.innerHTML = avatarImgHtml;
    row.appendChild(av);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typingRow');
    if (t) t.remove();
  }

  function addError(text) {
    const div = document.createElement('div');
    div.className = 'error-note';
    div.textContent = text;
    chat.appendChild(div);
    scrollToBottom();
  }

  async function sendToRock(userText) {
    history.push({ role: 'user', content: userText });

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || ('API error: ' + response.status));
      const replyText = data.reply || '……電波の調子が悪いみたいだな。もう一度頼む。';

      history.push({ role: 'assistant', content: replyText });
      removeTyping();
      addMessage('chief', replyText);
    } catch (err) {
      console.error('ロック API error:', err);
      removeTyping();
      addError('ロック、少し電池切れ気味です。もう一度送ってみてください。');
      history.pop();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    input.value = '';
    sendBtn.disabled = true;
    input.disabled = true;
    addTyping();

    sendToRock(text).finally(() => {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    });
  });

  // Opening line
  addMessage('chief', 'さぁ、今日はどんな謎を解きたいのだ・・？');
</script>

</body>
</html>
